<!DOCTYPE html>
<html>
<head>
<title>Sachin Panel (hackii)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>Sachin Panel (hackii)</h1>
  <span class="tag">VIP RNG SYSTEM</span>
</div>

<div class="clock" id="clock">00:00:00</div>

<div class="roundBox">
  <h2>ROUND RESULT</h2>
  <div id="result">⏳ WAITING...</div>
  <div class="count">Remaining: <span id="remain">60</span>s</div>
  <div class="final" id="status">Result 40s pe dikhega</div>
</div>

<script src="script.js"></script>
</body>
</html>
